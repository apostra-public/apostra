name: Validate Apostra CLI
on:
  pull_request:
    paths: ['sdk/cli/**', 'sdk/typescript/**', 'sdk/testing/**', 'sdk/release/**', '.github/workflows/*apostra-cli*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ['22.18.0', '24', '26.12.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global npm@11.5.1
      # The CLI needs an SDK release that may not be on npm yet, so it is checked
      # against the SDK in this same tree: pack that SDK, then install the CLI's
      # dependencies with it standing in for the published range.
      - run: npm ci --ignore-scripts
        working-directory: sdk/typescript
      - name: Pack the SDK from this tree
        run: mkdir -p "$RUNNER_TEMP/sdk" && npm pack --pack-destination "$RUNNER_TEMP/sdk"
        working-directory: sdk/typescript
      # Point the dependency at the packed SDK, install, then restore package.json
      # so the archive the smoke step packs keeps its published range. (An npm
      # override fails with EOVERRIDE on a direct dependency, and installing the
      # tarball over the unpublished range made npm crash intermittently with
      # "Cannot read properties of null (reading 'edgesOut')".)
      - name: Install the CLI's dependencies against that SDK
        run: |
          tarball=$(ls "$RUNNER_TEMP"/sdk/apostra-sdk-*.tgz)
          npm pkg set "dependencies.@apostra/sdk=file:$tarball"
          npm install --ignore-scripts --no-audit --no-fund
          git checkout -- package.json
        working-directory: sdk/cli
      - run: npm run type-check && npm test
        working-directory: sdk/cli
      - run: node sdk/testing/install-smoke.mjs . --public --targets cli
