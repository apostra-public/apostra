name: Validate MCP App host
on:
  pull_request:
    paths: ['sdk/mcp-app-host/**', 'sdk/testing/**', '.github/workflows/*mcp-app-host*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ['22.18.0', '24', '26.12.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts && npm run type-check && npm test
        working-directory: sdk/mcp-app-host
      - run: node sdk/testing/install-smoke.mjs . --public --targets mcp-app-host
